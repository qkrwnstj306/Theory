# =============================================================================
#  catalog.yml — 이 레포의 단일 원본(Single Source of Truth)
#
#  README.md, papers/<field>/README.md, notes/README.md, lectures/README.md,
#  그리고 GitHub Pages 사이트는 모두 이 파일에서 자동 생성됩니다.
#  README를 직접 고치지 말고 이 파일을 고친 뒤 아래를 실행하세요.
#
#      python scripts/build.py          # README들 재생성 + 링크 검사
#      python scripts/build.py serve    # 사이트 로컬 미리보기 (http://127.0.0.1:8000)
#
#  ── 새 논문 추가하기 ─────────────────────────────────────────────────────
#  1) templates/review.md 를 papers/<field>/<slug>/README.md 로 복사해서 리뷰 작성
#     (이미지는 같은 폴더에 두고 ./img1.png 처럼 참조)
#  2) 아래 papers: 목록에 항목 추가 (필수: title, field, dir)
#
#     - title: "DDIM: Denoising Diffusion Implicit Models"
#       field: diffusion              # fields: 의 id 중 하나
#       venue: ICLR                   # 생략하면 리뷰 2번째 줄 "*ICLR(2021), ...*" 에서 자동 추출
#       year: 2021
#       url: https://arxiv.org/abs/2010.02502
#       dir: papers/diffusion/ddim
#       review: papers/diffusion/ddim/README.md   # 생략 시 dir/README.md 가 있으면 자동 인식
#       notes: [papers/diffusion/ddim/ddim.pdf]   # 필기한 PDF
#       slides: [papers/diffusion/ddim/ddim-slides.pptx]
#       files: [{label: "기타 자료", path: ...}]
#       code: [https://github.com/...]
#       links: [{label: "관련 링크", url: ...}]
#       simple: true                  # 짧은 리뷰
#       added: 2026-11-18             # 생략 시 리뷰의 "Review Data: YYYY.MM.DD" 사용
# =============================================================================

